backend:
  name: turbo-github
  turbo_site_id: 2b2fca46-b1c4-48f3-b270-f5141f968e46
  branch: main
site_url: https://mraomedia.com
display_url: https://mraomedia.com
media_folder: photos/uploads
public_folder: /photos/uploads
editor:
  preview: false
collections:
  - name: portfolio
    label: Portfolio
    files:
      - label: Portfolio videos
        name: videos
        file: _data/portfolio.yml
        fields:
          - label: Videos
            label_singular: Video
            name: videos
            widget: list
            summary: "{{fields.title}} · {{fields.orientation}}"
            collapsed: true
            hint: Add a video or drag entries to reorder. The first three also appear in Latest Projects.
            fields:
              - label: Title
                name: title
                widget: string
              - label: YouTube link
                name: youtube_url
                widget: string
                hint: Paste a full YouTube, youtu.be, or YouTube Shorts link. Choose the video orientation below.
                pattern:
                  - ^https://(?:(?:(?:www\.|m\.)?youtube\.com)/(?:watch\?(?:[^#\s]*&)?v=[A-Za-z0-9_-]{11}(?:[&#][^\s]*)?|(?:shorts|embed|live)/[A-Za-z0-9_-]{11}(?:[/?#][^\s]*)?)|youtu\.be/[A-Za-z0-9_-]{11}(?:[/?#][^\s]*)?)$
                  - Paste a valid https:// YouTube video link (not a channel or playlist).
              - label: Video shape
                name: orientation
                widget: select
                default: horizontal
                options:
                  - label: Horizontal (16:9)
                    value: horizontal
                  - label: Vertical / Shorts (9:16)
                    value: vertical
              - label: Description
                name: blurb
                widget: text
              - label: Roles
                name: roles
                widget: select
                multiple: true
                min: 1
                options:
                  - producer
                  - editor
                  - videographer
              - label: Featured on the portfolio page
                name: featured
                widget: boolean
                default: false
                hint: Featured videos appear in the carousel, in the same order as this list.
              - label: Start at (seconds)
                name: start_seconds
                widget: number
                value_type: int
                min: 0
                default: 0
                required: false
                hint: Optional. Leave at 0 to play from the beginning; timestamp parameters in pasted links are
                  ignored.
              - label: End at (seconds)
                name: end_seconds
                widget: number
                value_type: int
                min: 1
                required: false
                hint: Optional. Must be after the start time.
      - label: Portfolio headings and showreel
        name: portfolio_settings
        file: _data/portfolio_settings.json
        fields:
          - label: Portfolio heading
            name: title
            widget: string
          - label: Featured heading
            name: featured_heading
            widget: string
          - label: Top showreel YouTube link
            name: reel_url
            widget: string
            hint: Paste a full YouTube, youtu.be, or YouTube Shorts link. Choose the video orientation below.
            pattern:
              - ^https://(?:(?:(?:www\.|m\.)?youtube\.com)/(?:watch\?(?:[^#\s]*&)?v=[A-Za-z0-9_-]{11}(?:[&#][^\s]*)?|(?:shorts|embed|live)/[A-Za-z0-9_-]{11}(?:[/?#][^\s]*)?)|youtu\.be/[A-Za-z0-9_-]{11}(?:[/?#][^\s]*)?)$
              - Paste a valid https:// YouTube video link (not a channel or playlist).
          - label: Showreel shape
            name: reel_orientation
            widget: select
            options:
              - horizontal
              - vertical
          - label: Latest projects heading
            name: latest_heading
            widget: string
          - label: Latest projects footer text
            name: latest_text
            widget: string
          - label: Portfolio link text
            name: latest_link_text
            widget: string
